[package]
name = "clearway"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fast, browser-agnostic, pure-Rust accessibility engine for HTML5 and DOM IR snapshots."
repository = "https://github.com/TheGreatAxios/clearway"
documentation = "https://docs.rs/clearway"
readme = "README.md"
keywords = ["accessibility", "wcag", "a11y", "aria", "html"]
categories = ["accessibility", "web-programming", "command-line-utilities"]
exclude = [".github/", "wasm/", "benchmarks/", "docs/"]

[dependencies]
ego-tree = "0.10"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
unwrap_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
