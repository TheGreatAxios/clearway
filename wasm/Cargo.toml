[package]
name = "clearway-wasm"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for clearway, a fast pure-Rust accessibility engine."
repository = "https://github.com/TheGreatAxios/clearway"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
clearway = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"
